<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1520" width="1100" height="1520" font-family="Calibri, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1520" fill="#FAF6F0" />

  <!-- Header -->
  <rect x="30" y="20" width="1040" height="72" rx="10" fill="#1E293B" />
  <text x="550" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">DIAGRAMA DE FLUJO DEL PROCESO DE MANUFACTURA — PAN DE SAL TIPO ROLLO</text>
  <text x="550" y="74" text-anchor="middle" font-size="13" fill="#FCD34D">Secuencia integral de 18 fases · Simbología estándar de operaciones, inspecciones, almacenamientos y decisiones</text>

  <!-- Legend -->
  <g transform="translate(40, 108)">
    <rect x="0" y="0" width="1020" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
    <circle cx="30" cy="22" r="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="48" y="26" font-size="12" font-weight="bold" fill="#1E293B">Operación (◯)</text>

    <rect x="175" y="12" width="20" height="20" fill="#D1FAE5" stroke="#059669" stroke-width="2" />
    <text x="203" y="26" font-size="12" font-weight="bold" fill="#1E293B">Inspección (▢)</text>

    <polygon points="335,12 355,12 345,32" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" />
    <text x="363" y="26" font-size="12" font-weight="bold" fill="#1E293B">Almacenamiento (▽)</text>

    <path d="M 520 12 L 534 12 A 10 10 0 0 1 534 32 L 520 32 Z" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" />
    <text x="548" y="26" font-size="12" font-weight="bold" fill="#1E293B">Demora / Reposo (D)</text>

    <polygon points="715,22 728,10 741,22 728,34" fill="#FFE4E6" stroke="#BE123C" stroke-width="2" />
    <text x="750" y="26" font-size="12" font-weight="bold" fill="#1E293B">Decisión (◇)</text>

    <rect x="865" y="12" width="22" height="20" rx="4" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <text x="895" y="26" font-size="12" font-weight="bold" fill="#1E293B">Transporte (⇨)</text>
  </g>

  <!-- Start Pill -->
  <rect x="470" y="170" width="160" height="36" rx="18" fill="#059669" />
  <text x="550" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">INICIO</text>
  <line x1="550" y1="206" x2="550" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 1 -->
  <g filter="url(#shadow)">
    <rect x="360" y="228" width="380" height="52" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2" />
    <text x="550" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#064E3B">1. Recepción de Materias Primas (▢)</text>
    <text x="550" y="268" text-anchor="middle" font-size="11" fill="#065F46">Entradas: Harina, agua, levadura, sal, azúcar, grasa, empaques</text>
  </g>
  <line x1="550" y1="280" x2="550" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 1 -->
  <polygon points="550,302 680,332 550,362 420,332" fill="#FFE4E6" stroke="#BE123C" stroke-width="2" />
  <text x="550" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#881337">¿MP Conforme?</text>
  <line x1="680" y1="332" x2="790" y2="332" stroke="#BE123C" stroke-width="2" marker-end="url(#arrow)" />
  <text x="735" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#BE123C">NO</text>
  <rect x="794" y="308" width="230" height="48" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.5" />
  <text x="909" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#881337">Cuarentena / Rechazo</text>
  <text x="909" y="346" text-anchor="middle" font-size="10" fill="#9F1239">Devolución al proveedor</text>

  <line x1="550" y1="362" x2="550" y2="386" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="565" y="378" font-size="11" font-weight="bold" fill="#059669">SÍ</text>

  <!-- Phase 2 -->
  <g filter="url(#shadow)">
    <rect x="360" y="388" width="380" height="48" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" />
    <text x="550" y="409" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">2. Almacenamiento de Materias Primas (▽)</text>
    <text x="550" y="426" text-anchor="middle" font-size="11" fill="#1E40AF">Rotación PEPS/FIFO · Secos &lt; 25 °C, HR &lt; 65%</text>
  </g>
  <line x1="550" y1="436" x2="550" y2="456" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 3 -->
  <g filter="url(#shadow)">
    <rect x="360" y="458" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="479" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">3. Pesaje y Dosificación (◯)</text>
    <text x="550" y="496" text-anchor="middle" font-size="11" fill="#92400E">Porcentaje panadero · Masa total piloto: 1.693 g</text>
  </g>
  <line x1="550" y1="506" x2="550" y2="526" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 4 -->
  <g filter="url(#shadow)">
    <rect x="360" y="528" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="549" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">4. Mezclado (◯)</text>
    <text x="550" y="566" text-anchor="middle" font-size="11" fill="#92400E">3–5 min vel. baja · T masa ref: 24–28 °C</text>
  </g>
  <line x1="550" y1="576" x2="550" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 5 -->
  <g filter="url(#shadow)">
    <rect x="360" y="598" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="619" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">5. Amasado (◯)</text>
    <text x="550" y="636" text-anchor="middle" font-size="11" fill="#92400E">8–12 min · Desarrollo red de gluten (Prueba del velo)</text>
  </g>
  <line x1="550" y1="646" x2="550" y2="666" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 6 -->
  <g filter="url(#shadow)">
    <rect x="360" y="668" width="380" height="48" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" />
    <text x="550" y="689" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C1D95">6. Primera Fermentación (D)</text>
    <text x="550" y="706" text-anchor="middle" font-size="11" fill="#5B21B6">45–60 min a 26–28 °C · Producción de CO₂</text>
  </g>
  <line x1="550" y1="716" x2="550" y2="736" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 7 & 8 side by side flow or vertical compact -->
  <g filter="url(#shadow)">
    <rect x="360" y="738" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="759" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">7. División o Porcionado (◯)</text>
    <text x="550" y="776" text-anchor="middle" font-size="11" fill="#92400E">Piezas uniformes de 80 g (~20–21 unidades)</text>
  </g>
  <line x1="550" y1="786" x2="550" y2="806" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="360" y="808" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="829" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">8. Boleado (◯)</text>
    <text x="550" y="846" text-anchor="middle" font-size="11" fill="#92400E">Tensión superficial y cierre basal</text>
  </g>
  <line x1="550" y1="856" x2="550" y2="876" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="360" y="878" width="380" height="48" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" />
    <text x="550" y="899" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C1D95">9. Reposo Intermedio (D)</text>
    <text x="550" y="916" text-anchor="middle" font-size="11" fill="#5B21B6">10–15 min cubierto · Relajación del gluten</text>
  </g>
  <line x1="550" y1="926" x2="550" y2="946" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="360" y="948" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="969" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">10. Formado (◯)</text>
    <text x="550" y="986" text-anchor="middle" font-size="11" fill="#92400E">Enrollado en rollo · Costura hacia abajo</text>
  </g>
  <line x1="550" y1="996" x2="550" y2="1016" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="360" y="1018" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="1039" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">11. Fermentación Final / Proofing (◯)</text>
    <text x="550" y="1056" text-anchor="middle" font-size="11" fill="#92400E">45–60 min · 28–32 °C · 75–85% HR</text>
  </g>
  <line x1="550" y1="1066" x2="550" y2="1086" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 12 Decision -->
  <polygon points="550,1088 700,1118 550,1148 400,1118" fill="#FFE4E6" stroke="#BE123C" stroke-width="2" />
  <text x="550" y="1115" text-anchor="middle" font-size="11" font-weight="bold" fill="#881337">12. ¿Greñado o</text>
  <text x="550" y="1129" text-anchor="middle" font-size="11" font-weight="bold" fill="#881337">acabado? (◇)</text>
  <line x1="700" y1="1118" x2="790" y2="1118" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="745" y="1110" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">SI APLICA</text>
  <rect x="794" y="1096" width="230" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="909" y="1116" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Brillo leve / corte superficial</text>
  <text x="909" y="1131" text-anchor="middle" font-size="10" fill="#B45309">(Opcional en pan blandito)</text>
  <path d="M 909 1140 L 909 1192 L 744 1192" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="550" y1="1148" x2="550" y2="1168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="595" y="1162" font-size="10" font-weight="bold" fill="#475569">NO (Liso)</text>

  <!-- Phase 13 -->
  <g filter="url(#shadow)">
    <rect x="360" y="1170" width="380" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="550" y="1191" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">13. Horneado (◯) [Posible PCC Térmico]</text>
    <text x="550" y="1208" text-anchor="middle" font-size="11" fill="#92400E">180–200 °C · 12–18 min · T interna ~82–96 °C</text>
  </g>
  <line x1="550" y1="1218" x2="550" y2="1238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 14 -->
  <g filter="url(#shadow)">
    <rect x="360" y="1240" width="380" height="44" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" />
    <text x="550" y="1260" text-anchor="middle" font-size="13" font-weight="bold" fill="#4C1D95">14. Enfriamiento (D)</text>
    <text x="550" y="1276" text-anchor="middle" font-size="11" fill="#5B21B6">30–60 min en rejillas hasta T &lt; 35 °C</text>
  </g>
  <line x1="550" y1="1284" x2="550" y2="1304" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 15 -->
  <g filter="url(#shadow)">
    <rect x="360" y="1306" width="380" height="44" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2" />
    <text x="550" y="1326" text-anchor="middle" font-size="13" font-weight="bold" fill="#064E3B">15. Inspección y Control de Calidad (▢)</text>
    <text x="550" y="1342" text-anchor="middle" font-size="11" fill="#065F46">Peso, color, miga y segregación de no conformes</text>
  </g>
  <line x1="740" y1="1328" x2="790" y2="1328" stroke="#BE123C" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="794" y="1308" width="230" height="40" rx="8" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.5" />
  <text x="909" y="1326" text-anchor="middle" font-size="11" font-weight="bold" fill="#881337">No Conforme</text>
  <text x="909" y="1340" text-anchor="middle" font-size="10" fill="#9F1239">Reproceso / destino / descarte</text>

  <line x1="550" y1="1350" x2="550" y2="1370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Phase 16, 17, 18 compact bottom row -->
  <g filter="url(#shadow)">
    <rect x="60" y="1372" width="290" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2" />
    <text x="205" y="1393" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">16. Empaque y Rotulado (◯)</text>
    <text x="205" y="1409" text-anchor="middle" font-size="10" fill="#92400E">Bolsa grado alimenticio, sello, lote</text>
  </g>
  <path d="M 550 1370 L 205 1370" fill="none" stroke="#475569" stroke-width="2" />
  <line x1="350" y1="1396" x2="398" y2="1396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="402" y="1372" width="296" height="48" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" />
    <text x="550" y="1393" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A8A">17. Almacenamiento PT (▽)</text>
    <text x="550" y="1409" text-anchor="middle" font-size="10" fill="#1E40AF">Canastillas PEPS · 15–25 °C</text>
  </g>
  <line x1="698" y1="1396" x2="746" y2="1396" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="750" y="1372" width="290" height="48" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <text x="895" y="1393" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E293B">18. Distribución (⇨)</text>
    <text x="895" y="1409" text-anchor="middle" font-size="10" fill="#334155">Vehículo limpio · Entrega al cliente</text>
  </g>

  <line x1="895" y1="1420" x2="895" y2="1450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="815" y="1452" width="160" height="36" rx="18" fill="#1E293B" />
  <text x="895" y="1475" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">FIN</text>
</svg>
